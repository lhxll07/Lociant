<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Desk</title>
<style>
:root{--bg:#080808;--card:#111;--line:#282828;--text:#e0e0e0;--muted:#707070;--green:#4ade80;--red:#f87171;--blue:#60a5fa;--orange:#fbbf24;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:var(--text);font-family:-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{padding:14px}
main{max-width:520px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.space{justify-content:space-between}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.35)}
.dot.red{background:var(--red);box-shadow:0 0 8px rgba(248,113,113,.3)}
.big-num{font-size:48px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width 1.2s ease}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em}
.pill.focus{color:var(--green);border:1px solid rgba(74,222,128,.25);background:rgba(74,222,128,.07)}
.pill.away{color:var(--red);border:1px solid rgba(248,113,113,.25);background:rgba(248,113,113,.07)}
.pill.stale{color:var(--orange);border:1px solid rgba(251,191,36,.25);background:rgba(251,191,36,.07)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{text-align:center}
.stat-num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-label{color:var(--muted);font-size:10px;margin-top:2px;text-transform:uppercase}
.footer{font-size:11px;color:var(--muted);text-align:center}
.err{color:var(--red);font-size:12px;margin-top:8px}
.insight{font-size:13px;line-height:1.55;color:var(--text);white-space:pre-wrap}
.insight.muted{color:var(--muted)}
button{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);padding:5px 14px;font-size:12px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:wait}
.gear-btn{width:30px;height:30px;border-radius:50%;padding:0;font-size:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s ease;display:grid;align-items:center;justify-items:center;padding:18px}
.overlay.active{opacity:1;pointer-events:auto}
.panel{width:min(100%,480px);padding:18px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(14,14,14,.95);box-shadow:0 24px 70px rgba(0,0,0,.38)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-title{font-size:16px;font-weight:800}
.setting-row{display:grid;grid-template-columns:120px 1fr 48px;gap:12px;align-items:center;min-height:38px;font-size:13px}
.setting-label{color:var(--muted);font-weight:700}
.setting-val{color:var(--blue);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--blue);height:4px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="row space">
      <div class="row">
        <span class="dot red" id="presenceDot"></span>
        <span class="label" id="presenceText">Checking...</span>
      </div>
      <div class="row">
        <span class="pill stale" id="statusPill">&#x25CF; Idle</span>
        <button class="gear-btn" onclick="toggleSettings()" title="Settings">&#x2699;</button>
      </div>
    </div>
    <canvas id="previewCanvas" style="display:none;width:100%;border-radius:10px;margin-top:10px;aspect-ratio:4/3;background:#000"></canvas>
  </div>

  <div class="card">
    <div class="label">Focus today</div>
    <div class="row" style="margin-top:4px">
      <span class="big-num" id="focusTime">00:00</span>
      <span class="unit" id="focusLabel">hrs</span>
    </div>
    <div class="progress"><div class="progress-fill" id="bar" style="width:0%"></div></div>
    <div class="row space" style="margin-top:6px">
      <span class="label" id="goalLabel">0 / 4h</span>
      <span class="label" id="pctLabel">0%</span>
    </div>
  </div>

  <div class="card">
    <div class="stat-grid">
      <div class="stat"><div class="stat-num" id="streak">0min</div><div class="stat-label">Current streak</div></div>
      <div class="stat"><div class="stat-num" id="breaks">0</div><div class="stat-label">Breaks</div></div>
      <div class="stat"><div class="stat-num" id="distractions">0</div><div class="stat-label">Distractions</div></div>
    </div>
  </div>

  <div class="card">
    <div class="row space">
      <div>
        <div class="label">Local insight</div>
        <div class="footer" style="text-align:left;margin-top:2px">Camera tools + local model</div>
      </div>
      <button onclick="analyzeDesk()" id="analyzeBtn" style="color:var(--blue);border-color:rgba(96,165,250,.25)">Analyze</button>
    </div>
    <div class="insight muted" id="insightText" style="margin-top:10px">Start camera, then analyze the desk.</div>
  </div>

  <div class="row space" style="margin-top:8px">
    <div class="row">
      <button onclick="startCamera()" id="startBtn" style="color:var(--green);border-color:rgba(74,222,128,.25)">Start Camera</button>
      <button onclick="stopCamera()" id="stopBtn" style="display:none;color:var(--red);border-color:rgba(248,113,113,.25)">Stop</button>
    </div>
    <button onclick="refresh()">Refresh</button>
  </div>
  <span class="footer" id="footerMsg" style="display:block;margin-top:4px">Polling...</span>
  <div class="err" id="errMsg"></div>
</main>

<div class="overlay" id="settingsOverlay">
  <div class="panel" onclick="event.stopPropagation()">
    <div class="panel-head">
      <div class="panel-title">Vision Settings</div>
      <button onclick="toggleSettings()">Done</button>
    </div>
    <div class="setting-row">
      <div class="setting-label">Confidence</div>
      <input type="range" id="confRange" min="0.20" max="0.85" step="0.05">
      <div class="setting-val" id="confVal">0.45</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">Inference</div>
      <input type="range" id="inferRange" min="50" max="1000" step="50">
      <div class="setting-val" id="inferVal">250ms</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">Backend</div>
      <select id="backendSelect" style="font-size:13px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px">
        <option value="auto">Auto</option>
        <option value="cpu">CPU</option>
        <option value="vulkan">Vulkan</option>
      </select>
      <div class="setting-val" id="backendVal">auto</div>
    </div>
    <div class="setting-row">
      <div class="setting-label">FPS</div>
      <input type="range" id="previewRange" min="5" max="30" step="1">
      <div class="setting-val" id="previewVal">20fps</div>
    </div>
    <div class="footer" style="margin-top:14px">Changes apply on next camera start.</div>
  </div>
</div>

<script>
const API = (() => {
  let shellApi = window.MNNodeAPI || (() => { try { return parent.MNNodeAPI } catch(e) { return null } })()
  let base = ((shellApi && shellApi.baseUrl) || 'http://127.0.0.1:11434').replace(/\/$/,'')
  const headers = () => {
    const h = {'Content-Type':'application/json'}
    try {
      const token = shellApi && shellApi.authToken
      if (token) h.Authorization = 'Bearer ' + token
    } catch(e) {}
    return h
  }
  return {
    get base() { return base },
    setBase: v => { if (v) base = String(v).replace(/\/$/,'') },
    setShellApi: api => { shellApi = api || shellApi },
    get: p => fetch(base + p, {headers:headers()}).then(async r => { const j = await r.json(); if (!r.ok) throw new Error((j.error&&j.error.message)||j.message||r.statusText); return j }),
    post: (p, d) => fetch(base + p, {method:'POST', headers:headers(), body:JSON.stringify(d||{})})
      .then(async r => { const j = await r.json(); if (!r.ok) throw new Error((j.error&&j.error.message)||j.message||r.statusText); return j }),
    tool: (name, args) => fetch(base + '/v1/tools/' + encodeURIComponent(name) + '/call', {
      method:'POST', headers:headers(), body:JSON.stringify({arguments:args||{}})
    }).then(async r => { const j = await r.json(); if (!r.ok || !j.ok) throw new Error((j.error&&j.error.message)||(j.result&&j.result.message)||j.message||r.statusText); return j.result || j }),
    chat: d => fetch(base + '/v1/chat/completions', {
      method:'POST', headers:headers(), body:JSON.stringify(d||{})
    }).then(async r => { const j = await r.json(); if (!r.ok) throw new Error((j.error&&j.error.message)||j.message||r.statusText); return j })
  }
})()

const STORAGE_KEY = 'mnnode.study-desk.settings'
const SETTINGS_DEFAULTS = { confidence: 0.45, inferenceMs: 250, previewMs: 250, backend: 'auto' }
let settings = { ...SETTINGS_DEFAULTS }

function loadSettings() {
  try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); settings = { ...SETTINGS_DEFAULTS, ...saved } } catch(e) {}
}
function saveSettings() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)) } catch(e) {}
  renderSettingsUI()
}
function renderSettingsUI() {
  document.getElementById('confRange').value = settings.confidence
  document.getElementById('confVal').textContent = settings.confidence.toFixed(2)
  document.getElementById('inferRange').value = settings.inferenceMs
  document.getElementById('inferVal').textContent = settings.inferenceMs + 'ms'
  const fps = Math.round(1000 / (settings.previewMs || 50))
  document.getElementById('previewRange').value = fps
  document.getElementById('previewVal').textContent = fps + 'fps'
  document.getElementById('backendSelect').value = settings.backend
  document.getElementById('backendVal').textContent = settings.backend
}

function toggleSettings() {
  const o = document.getElementById('settingsOverlay')
  const active = !o.classList.contains('active')
  o.classList.toggle('active', active)
  if (active) renderSettingsUI()
}

// Wire settings controls
document.getElementById('confRange').addEventListener('input', e => { settings.confidence = +e.target.value; saveSettings() })
document.getElementById('inferRange').addEventListener('input', e => { settings.inferenceMs = +e.target.value; saveSettings() })
document.getElementById('previewRange').addEventListener('input', e => { settings.previewMs = Math.round(1000 / +e.target.value); saveSettings() })
document.getElementById('backendSelect').addEventListener('change', e => { settings.backend = e.target.value; saveSettings() })
document.getElementById('settingsOverlay').addEventListener('click', () => toggleSettings())
loadSettings()

let pollCount = 0, visionRunning = false, startingVision = false, streamTimer = 0, permissionStream = null
const GOAL = 14400

async function ensureCameraPermission() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return
  permissionStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false })
  permissionStream.getTracks().forEach(t => t.stop())
  permissionStream = null
}

async function startCamera() {
  startingVision = true; updateButtons()
  const el = document.getElementById('errMsg'); el.textContent = 'Loading triggers...'
  try {
    await ensureCameraPermission()
    await API.post('/v1/scenes/study-desk/load', {})
    el.textContent = 'Starting camera...'
    const r = await API.tool('vision_start', {
      modelId:'yolov8n', backend:settings.backend, confidenceThreshold:settings.confidence,
      inferenceIntervalMs:settings.inferenceMs,
      previewIntervalMs:settings.previewMs
    })
    if (!r || r.ok === false) {
      const msg = (r && r.error && r.error.message) || (r && r.message) || 'Camera start failed.'
      el.textContent = msg; startingVision = false; updateButtons(); return false
    }
    for (let i = 0; i < 20; i++) {
      await new Promise(r => setTimeout(r, 800))
      const vis = await API.tool('vision_status', {})
      if (vis && vis.running) { visionRunning = true; startingVision = false; updateButtons(); el.textContent = ''; startStream(); return true }
    }
    el.textContent = 'Camera start timed out.'
  } catch(e) { el.textContent = 'Start failed: ' + e.message }
  startingVision = false; updateButtons(); return false
}
function startStream() {
  const canvas = document.getElementById('previewCanvas')
  const ctx = canvas.getContext('2d')
  canvas.style.display = ''
  let timer = 1, lastFrameTime = 0, dtHistory = [], latestBitmap = null, frameVersion = 0, drawnVersion = 0, animId = 0
  streamTimer = timer
  const delay = Math.max(33, settings.previewMs || 50)

  async function fetchLoop() {
    while (streamTimer === timer) {
      try {
        const resp = await fetch(API.base + '/v1/preview?' + Date.now())
        const blob = await resp.blob()
        const bmp = await createImageBitmap(blob)
        if (latestBitmap) latestBitmap.close()
        latestBitmap = bmp; frameVersion++
      } catch(e) {}
      await new Promise(r => setTimeout(r, delay))
    }
  }

  function drawLoop() {
    if (streamTimer !== timer) { cancelAnimationFrame(animId); return }
    const now = performance.now()
    if (latestBitmap && drawnVersion !== frameVersion) {
      canvas.width = latestBitmap.width; canvas.height = latestBitmap.height
      ctx.drawImage(latestBitmap, 0, 0)
      drawnVersion = frameVersion
      if (lastFrameTime > 0) {
        const dt = now - lastFrameTime
        if (dt > 0 && dt < 300) {
          dtHistory.push(dt)
          if (dtHistory.length > 15) dtHistory.shift()
          const avg = dtHistory.reduce((a,b)=>a+b,0)/dtHistory.length
          ctx.font = '12px monospace'; ctx.fillStyle = 'rgba(0,0,0,0.6)'
          ctx.fillRect(4, canvas.height-20, 100, 18)
          ctx.fillStyle = '#4ade80'; ctx.fillText(Math.round(1000/avg)+'fps', 8, canvas.height-6)
        }
      }
      lastFrameTime = now
    }
    animId = requestAnimationFrame(drawLoop)
  }

  fetchLoop()
  animId = requestAnimationFrame(drawLoop)
}
async function stopCamera() {
  streamTimer = 0
  await API.tool('vision_stop', {})
  visionRunning = false; updateButtons()
  const c = document.getElementById('previewCanvas'); c.style.display = 'none'
}
function updateButtons() {
  const sb = document.getElementById('startBtn'), st = document.getElementById('stopBtn')
  if (startingVision) { sb.style.display='none'; st.style.display='none'; return }
  sb.style.display = visionRunning ? 'none' : ''
  st.style.display = visionRunning ? '' : 'none'
}

function fmtHM(totalSec) {
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60)
  return h > 0 ? h + 'h ' + m + 'min' : m + 'min'
}

async function refresh() {
  const el = (id) => document.getElementById(id)
  el('errMsg').textContent = ''; pollCount++
  try {
    const [store, vis] = await Promise.all([
      API.get('/v1/store/study-desk'),
      API.tool('vision_status', {})
    ])
    const vs = store.values || {}
    const focus = Math.floor((vs.focus_seconds && vs.focus_seconds.value) || 0)
    const bks = Math.floor((vs.break_count && vs.break_count.value) || 0)
    const dst = Math.floor((vs.distraction_count && vs.distraction_count.value) || 0)
    const running = vis && vis.running
    visionRunning = running; updateButtons()

    el('focusTime').textContent = fmtHM(focus)
    el('goalLabel').textContent = fmtHM(focus) + ' / 4h'
    el('pctLabel').textContent = Math.round(focus / GOAL * 100) + '%'
    el('bar').style.width = Math.min(100, focus / GOAL * 100) + '%'
    el('breaks').textContent = bks
    el('distractions').textContent = dst
    el('streak').textContent = fmtHM(focus)

    const det = vis && vis.lastDetection
    const dets = (det && Array.isArray(det.detections)) ? det.detections : []
    const topDets = dets.slice(0,3).map(d => d.label + ' ' + Math.round((d.score||0)*100) + '%').join(', ')
    el('footerMsg').textContent = running
      ? 'Active ' + Math.round((vis.fps||0)) + 'fps · ' + (topDets || 'no objects')
      : 'Camera idle'

    const dot = el('presenceDot'), txt = el('presenceText'), pill = el('statusPill')
    if (!running) {
      dot.className = 'dot red'; txt.textContent = 'Camera not started'
      pill.className = 'pill stale'; pill.innerHTML = '&#x25CF; Idle'
    } else if (dets.some(d => d.classId === 0 || (d.score||0) > 0)) {
      dot.className = 'dot green'; txt.textContent = 'Person detected'
      pill.className = 'pill focus'; pill.innerHTML = '&#x25CF; Active'
    } else {
      dot.className = 'dot red'; txt.textContent = 'No person visible'
      pill.className = 'pill stale'; pill.innerHTML = '&#x25CF; Waiting'
    }
  } catch(e) {
    el('errMsg').textContent = 'Cannot reach API server.'
  }
}

function detectionSummary(vis) {
  const det = vis && vis.lastDetection
  const dets = (det && Array.isArray(det.detections)) ? det.detections : []
  if (!dets.length) return 'No objects are currently detected.'
  return dets.slice(0, 8).map(d => `${d.label || 'object'} ${Math.round((d.score || 0) * 100)}%`).join(', ')
}

function answerFromChat(resp) {
  const choice = resp && resp.choices && resp.choices[0]
  return (choice && choice.message && choice.message.content || '').trim()
}

async function fallbackInsight(reason) {
  const vis = await API.tool('vision_status', {})
  const running = vis && vis.running
  const summary = detectionSummary(vis)
  return (reason ? 'Local model unavailable: ' + reason + '\n\n' : '') +
    (running ? 'Vision is running. ' : 'Camera is idle. ') +
    'Detected: ' + summary
}

async function analyzeDesk() {
  const btn = document.getElementById('analyzeBtn')
  const out = document.getElementById('insightText')
  btn.disabled = true
  out.className = 'insight muted'
  out.textContent = 'Analyzing locally...'
  try {
    if (!visionRunning && !await startCamera()) throw new Error('camera start failed')
    await new Promise(r => setTimeout(r, 500))
    const shot = await API.tool('camera_capture', {})
    const image = shot && shot.image
    if (!image) throw new Error('camera frame unavailable')
    const resp = await API.chat({
      messages: [{
        role: 'user',
        content: [
          {type:'text', text:'Analyze this study desk image briefly. Say whether someone appears present, whether the desk looks focused or distracting, and give one practical suggestion. Keep the answer under 60 Chinese characters if the user interface language is Chinese.'},
          {type:'image_url', image_url:{url:image}}
        ]
      }],
      max_tokens: 96,
      stream: false
    })
    const text = answerFromChat(resp)
    out.className = 'insight'
    out.textContent = text || await fallbackInsight('empty response')
  } catch(e) {
    out.className = 'insight'
    out.textContent = await fallbackInsight(e.message || 'analysis failed')
  } finally {
    btn.disabled = false
  }
}
window.addEventListener('message', event => {
  if (event.data && event.data.type === 'api.ready') {
    API.setBase(event.data.baseUrl)
    try { API.setShellApi(parent.MNNodeAPI) } catch(e) {}
  }
})
refresh(); setInterval(refresh, 4000)
</script>
</body>
</html>
