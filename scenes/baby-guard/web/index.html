<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Baby Guard</title>
  <style>
    :root {
      --bg: #080808;
      --panel: #111111;
      --panel-soft: #151515;
      --line: #242424;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --blue: #69a8ff;
      --warn: #ffbd68;
      --danger: #ff6b6b;
      --ease: cubic-bezier(.22, .8, .24, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    button {
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(100%, 1120px);
      min-height: 100vh;
      padding: 22px 22px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, .9fr);
      gap: 18px;
    }

    .camera {
      position: relative;
      min-height: 420px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #0d0d0d;
    }

    .camera-video,
    .camera-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050505;
    }

    .camera-video,
    .camera.has-frame .camera-placeholder { display: none; }
    .camera.live .camera-video,
    .camera.has-frame .camera-frame { display: block; }
    .camera-frame { display: none; }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .camera-badge {
      position: absolute;
      left: 14px;
      top: 14px;
      height: 32px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      background: rgba(0,0,0,.52);
      color: #e8e8e8;
      font-size: 12px;
      font-weight: 800;
    }

    .camera-actions {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .tool-button {
      height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(18,18,18,.9);
      color: #e8e8e8;
      font-size: 13px;
      font-weight: 800;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .tool-button:hover { background: #181818; border-color: #343434; }

    .metrics {
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #b8b8b8;
      font-size: 12px;
      font-weight: 700;
    }

    .side {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      margin: 0;
      color: #f0f0f0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: .01em;
    }

    .settings-button {
      height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #111111;
      color: #d8d8d8;
      font-size: 13px;
      font-weight: 800;
    }

    .status {
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .state-pill {
      display: inline-flex;
      align-items: center;
      height: 34px;
      padding: 0 13px;
      border: 1px solid rgba(105,168,255,.28);
      border-radius: 999px;
      color: var(--blue);
      background: rgba(16,27,42,.8);
      font-size: 13px;
      font-weight: 900;
    }

    .state-pill.alert {
      color: var(--danger);
      border-color: rgba(255,107,107,.28);
      background: rgba(48,18,18,.72);
    }

    .state-pill.watch {
      color: var(--warn);
      border-color: rgba(255,189,104,.28);
      background: rgba(42,28,13,.65);
    }

    .state-hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .duration-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .duration-item {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #101010;
    }

    .duration-name {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .duration-value {
      margin-top: 6px;
      color: #eeeeee;
      font-size: 15px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .events {
      display: grid;
      gap: 8px;
    }

    .event {
      display: grid;
      grid-template-columns: 68px 1fr;
      gap: 10px;
      min-height: 34px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.06);
      color: #d8d8d8;
      font-size: 12px;
      font-weight: 700;
    }

    .event-time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .event-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .settings-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: clamp(18px, 5vh, 42px) 18px 18px;
      background: rgba(0,0,0,.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .settings-layer.active {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-panel {
      width: min(100%, 520px);
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 20px;
      background: rgba(14,14,14,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    .settings-head,
    .rule-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-head { margin-bottom: 16px; }

    .settings-title,
    .rule-id {
      color: #f0f0f0;
      font-size: 14px;
      font-weight: 900;
    }

    .settings-close {
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-size: 13px;
    }

    .settings-tabs,
    .segmented {
      display: grid;
      gap: 8px;
    }

    .settings-tabs {
      grid-template-columns: repeat(2, 1fr);
      margin-bottom: 16px;
    }

    .segmented { grid-template-columns: repeat(3, 1fr); }

    .settings-tab,
    .segmented button {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.035);
      color: #aaa;
      font-size: 12px;
      font-weight: 900;
    }

    .settings-tab.active,
    .segmented button.active {
      color: var(--blue);
      border-color: rgba(105,168,255,.3);
      background: rgba(16,27,42,.88);
    }

    .settings-page { display: none; }
    .settings-page.active { display: block; }

    .setting-row {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr) 58px;
      gap: 12px;
      align-items: center;
      min-height: 42px;
      color: #dcdcdc;
      font-size: 13px;
    }

    .setting-label { color: var(--muted); font-weight: 800; }
    .setting-value { color: var(--blue); text-align: right; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--blue); }

    .settings-note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .settings-note.active { color: var(--blue); }

    .debug-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .debug-metric,
    .rule-item {
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.028);
    }

    .debug-metric { padding: 10px; }
    .debug-label { color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .debug-value { margin-top: 6px; color: #eeeeee; font-size: 13px; font-weight: 900; font-variant-numeric: tabular-nums; }

    .rule-list { display: grid; gap: 8px; }
    .rule-item { padding: 12px; }
    .rule-id { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .rule-status {
      height: 24px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      color: #a8a8a8;
      font-size: 11px;
      font-weight: 900;
    }

    .rule-status.ready { color: var(--blue); border-color: rgba(105,168,255,.3); background: rgba(16,27,42,.76); }
    .rule-status.matched { color: #b9d9ff; border-color: rgba(105,168,255,.22); }
    .rule-status.cooldown { color: var(--warn); border-color: rgba(255,189,104,.28); background: rgba(42,28,13,.54); }

    .rule-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .rule-meta span,
    .condition-chip {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rule-conditions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .condition-chip {
      max-width: 100%;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      color: #8e8e8e;
      background: rgba(255,255,255,.025);
      font-size: 11px;
      font-weight: 800;
    }

    .condition-chip.matched {
      color: var(--blue);
      border-color: rgba(105,168,255,.26);
      background: rgba(16,27,42,.58);
    }

    @media (max-width: 860px) {
      .scene { grid-template-columns: 1fr; }
      .camera { min-height: 340px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="camera" id="cameraBox" role="button" tabindex="0">
      <video class="camera-video" id="cameraVideo" autoplay muted playsinline></video>
      <img class="camera-frame" id="visionPreview" alt="Vision Preview">
      <div class="camera-placeholder">Tap Preview or Analyze</div>
      <div class="camera-badge" id="cameraBadge">Idle</div>
      <div class="camera-actions">
        <button class="tool-button" id="previewBtn" type="button">Preview</button>
        <button class="tool-button" id="visionBtn" type="button">Analyze</button>
        <div class="metrics" id="visionMetrics">Vision Idle</div>
      </div>
    </section>

    <section class="side">
      <div class="topbar">
        <h1 class="title">Baby Guard</h1>
        <button class="settings-button" id="settingsBtn" type="button">Settings</button>
      </div>

      <div class="status">
        <div class="state-pill watch" id="statePill">Watch</div>
        <div class="state-hint" id="stateHint">Press Start to track presence.</div>
        <div class="duration-row">
          <div class="duration-item"><div class="duration-name">Watch</div><div class="duration-value" id="watchDuration">00:00</div></div>
          <div class="duration-item"><div class="duration-name">Safe</div><div class="duration-value" id="safeDuration">00:00</div></div>
          <div class="duration-item"><div class="duration-name">Alert</div><div class="duration-value" id="alertDuration">00:00</div></div>
        </div>
      </div>

      <div class="camera-actions" style="position: static; left: auto; right: auto; bottom: auto;">
        <button class="tool-button" id="startBtn" type="button">Start</button>
        <button class="tool-button" id="pauseBtn" type="button">Pause</button>
        <button class="tool-button" id="resetBtn" type="button">Reset</button>
      </div>

      <div class="events" id="events"></div>

      <div class="settings-layer" id="settingsLayer" aria-hidden="true">
        <div class="settings-panel">
          <div class="settings-head">
            <div class="settings-title">Settings</div>
            <button class="settings-close" id="settingsClose" type="button">Done</button>
          </div>
          <div class="settings-tabs" id="settingsTabs">
            <button class="settings-tab active" type="button" data-page="runtime">Runtime</button>
            <button class="settings-tab" type="button" data-page="rules">Rules</button>
          </div>
          <div class="settings-page active" id="settingsPageRuntime">
            <div class="setting-row">
              <div class="setting-label">Backend</div>
              <div class="segmented" id="backendGroup">
                <button type="button" data-backend="auto">Auto</button>
                <button type="button" data-backend="cpu">CPU</button>
                <button type="button" data-backend="vulkan">Vulkan</button>
              </div>
              <div class="setting-value" id="backendValue">auto</div>
            </div>
            <div class="setting-row">
              <div class="setting-label">Inference</div>
              <input id="inferRange" type="range" min="150" max="1200" step="50">
              <div class="setting-value" id="inferValue">300ms</div>
            </div>
            <div class="setting-row">
              <div class="setting-label">Preview</div>
              <input id="previewRange" type="range" min="150" max="1200" step="50">
              <div class="setting-value" id="previewValue">300ms</div>
            </div>
            <div class="setting-row">
              <div class="setting-label">Confidence</div>
              <input id="confRange" type="range" min="0.25" max="0.85" step="0.05">
              <div class="setting-value" id="confValue">0.45</div>
            </div>
            <div class="settings-note" id="settingsNote">Settings apply on next Analyze start.</div>
          </div>
          <div class="settings-page" id="settingsPageRules">
            <div class="debug-summary">
              <div class="debug-metric"><div class="debug-label">Session</div><div class="debug-value" id="debugSession">Idle</div></div>
              <div class="debug-metric"><div class="debug-label">State</div><div class="debug-value" id="debugState">Watch</div></div>
              <div class="debug-metric"><div class="debug-label">Frame</div><div class="debug-value" id="debugFrame">--</div></div>
            </div>
            <div class="rule-list" id="ruleDebugList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SCENE_ID = 'baby-guard'
    const events = document.getElementById('events')
    const statePill = document.getElementById('statePill')
    const stateHint = document.getElementById('stateHint')
    const watchDuration = document.getElementById('watchDuration')
    const safeDuration = document.getElementById('safeDuration')
    const alertDuration = document.getElementById('alertDuration')
    const cameraBox = document.getElementById('cameraBox')
    const cameraBadge = document.getElementById('cameraBadge')
    const cameraVideo = document.getElementById('cameraVideo')
    const visionPreview = document.getElementById('visionPreview')
    const previewBtn = document.getElementById('previewBtn')
    const visionBtn = document.getElementById('visionBtn')
    const visionMetrics = document.getElementById('visionMetrics')
    const settingsBtn = document.getElementById('settingsBtn')
    const settingsLayer = document.getElementById('settingsLayer')
    const settingsClose = document.getElementById('settingsClose')
    const settingsTabs = document.getElementById('settingsTabs')
    const settingsPageRuntime = document.getElementById('settingsPageRuntime')
    const settingsPageRules = document.getElementById('settingsPageRules')
    const backendGroup = document.getElementById('backendGroup')
    const backendValue = document.getElementById('backendValue')
    const inferRange = document.getElementById('inferRange')
    const inferValue = document.getElementById('inferValue')
    const previewRange = document.getElementById('previewRange')
    const previewValue = document.getElementById('previewValue')
    const confRange = document.getElementById('confRange')
    const confValue = document.getElementById('confValue')
    const settingsNote = document.getElementById('settingsNote')
    const debugSession = document.getElementById('debugSession')
    const debugState = document.getElementById('debugState')
    const debugFrame = document.getElementById('debugFrame')
    const ruleDebugList = document.getElementById('ruleDebugList')

    let runtimeSnapshot = { active: false, sessionState: 'idle', state: 'watch', durations: {}, events: [], rules: [] }
    let runtimeEventIds = new Set()
    let log = []
    let cameraStream = null
    let visionRunning = false
    let visionSettingsDirty = false
    let latestPreview = ''
    let settingsPage = 'runtime'

    const settingsKey = 'mnnode.baby-guard.vision'
    const defaultVisionSettings = {
      backend: 'auto',
      inferenceIntervalMs: 300,
      previewIntervalMs: 300,
      confidenceThreshold: 0.45
    }

    function postToShell(message) {
      if (parent && parent !== window) parent.postMessage(message, '*')
    }

    function now() {
      return new Date().toLocaleTimeString('zh-CN', { hour12: false })
    }

    function fmtShort(ms) {
      const total = Math.max(0, Math.floor((Number(ms) || 0) / 1000))
      const m = String(Math.floor(total / 60)).padStart(2, '0')
      const s = String(total % 60).padStart(2, '0')
      return m + ':' + s
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max)
    }

    function numberOr(value, fallback) {
      const next = Number(value)
      return Number.isFinite(next) ? next : fallback
    }

    function normalizeBackend(value) {
      return ['auto', 'cpu', 'vulkan'].includes(value) ? value : 'auto'
    }

    function normalizeVisionSettings(value) {
      const source = value && typeof value === 'object' ? value : {}
      return {
        backend: normalizeBackend(source.backend || defaultVisionSettings.backend),
        inferenceIntervalMs: Math.round(clamp(numberOr(source.inferenceIntervalMs, defaultVisionSettings.inferenceIntervalMs), 150, 1200) / 50) * 50,
        previewIntervalMs: Math.round(clamp(numberOr(source.previewIntervalMs, defaultVisionSettings.previewIntervalMs), 150, 1200) / 50) * 50,
        confidenceThreshold: Math.round(clamp(numberOr(source.confidenceThreshold, defaultVisionSettings.confidenceThreshold), 0.25, 0.85) * 20) / 20
      }
    }

    function loadVisionSettings() {
      try {
        return normalizeVisionSettings(JSON.parse(localStorage.getItem(settingsKey) || '{}'))
      } catch (error) {
        return normalizeVisionSettings(defaultVisionSettings)
      }
    }

    let visionSettings = loadVisionSettings()

    function saveVisionSettings() {
      try { localStorage.setItem(settingsKey, JSON.stringify(visionSettings)) } catch (error) {}
    }

    function stateLabel(state) {
      if (state === 'safe') return 'Safe'
      if (state === 'alert') return 'Alert'
      return 'Watch'
    }

    function normalizeState(state) {
      if (state === 'safe') return 'safe'
      if (state === 'alert') return 'alert'
      return 'watch'
    }

    function addEvent(text, options) {
      if (!runtimeSnapshot.sessionStartedAt && !(options && options.force)) return
      log.push({ time: now(), text })
      log = log.slice(-8)
      renderEvents()
      postToShell({ type: 'scene.event', sceneId: SCENE_ID, text })
    }

    function renderEvents() {
      events.innerHTML = log.slice().reverse().map(item =>
        '<div class="event"><span class="event-time">' + item.time + '</span><span class="event-text">' + escapeHtml(item.text) + '</span></div>'
      ).join('')
    }

    function applyRuntimeEvent(event) {
      if (!event || runtimeEventIds.has(event.id)) return
      runtimeEventIds.add(event.id)
      addEvent(event.name || event.ruleId || 'runtime event', { force: true })
    }

    function applyRuntimeMessage(message) {
      if (!message || (message.sceneId && message.sceneId !== SCENE_ID)) return
      if (message.type === 'runtime.snapshot') {
        runtimeSnapshot = Object.assign({}, runtimeSnapshot, message)
        ;(Array.isArray(message.events) ? message.events.slice().reverse() : []).forEach(applyRuntimeEvent)
      }
      if (message.type === 'runtime.state') {
        runtimeSnapshot = Object.assign({}, runtimeSnapshot, {
          state: message.state,
          sessionState: message.sessionState || runtimeSnapshot.sessionState,
          stateStartedAt: message.stateStartedAt || runtimeSnapshot.stateStartedAt,
          elapsedMs: message.elapsedMs || runtimeSnapshot.elapsedMs,
          durations: message.durations || runtimeSnapshot.durations
        })
      }
      if (message.type === 'runtime.event') applyRuntimeEvent(message.event)
      renderStatus()
      renderRuleDebug()
      renderEvents()
    }

    function renderStatus() {
      const state = normalizeState(runtimeSnapshot.state)
      const sessionState = runtimeSnapshot.sessionState || 'idle'
      const durations = Object.assign({ watch: 0, safe: 0, alert: 0 }, runtimeSnapshot.durations || {})
      statePill.textContent = stateLabel(state)
      statePill.className = 'state-pill ' + state
      stateHint.textContent = sessionState === 'running'
        ? 'Tracking person presence.'
        : (sessionState === 'paused' ? 'Paused.' : 'Press Start to track presence.')
      watchDuration.textContent = fmtShort(durations.watch || 0)
      safeDuration.textContent = fmtShort(durations.safe || 0)
      alertDuration.textContent = fmtShort(durations.alert || 0)
    }

    function formatMs(ms) {
      const value = Math.max(0, Number(ms) || 0)
      if (value >= 1000) return (value / 1000).toFixed(value >= 10000 ? 0 : 1) + 's'
      return Math.round(value) + 'ms'
    }

    function formatAgo(timestamp) {
      const value = Number(timestamp) || 0
      if (!value) return 'never'
      return formatMs(Date.now() - value) + ' ago'
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function conditionText(condition) {
      const label = condition.present || condition.missing || ('class ' + condition.classId)
      const mode = condition.missing ? 'missing' : 'present'
      return mode + ' ' + label + ' >= ' + Number(condition.confidenceGte || 0).toFixed(2)
    }

    function ruleStatus(rule) {
      if (rule.cooldownRemainingMs > 0) return { text: 'Cooldown', className: 'cooldown' }
      if (rule.ready) return { text: 'Ready', className: 'ready' }
      if (rule.matched) return { text: 'Matched', className: 'matched' }
      if (!rule.stateAllowed) return { text: 'State gated', className: '' }
      return { text: 'Waiting', className: '' }
    }

    function renderRuleDebug() {
      debugSession.textContent = runtimeSnapshot.sessionState || 'idle'
      debugState.textContent = stateLabel(normalizeState(runtimeSnapshot.state))
      debugFrame.textContent = runtimeSnapshot.lastFrameAt ? formatAgo(runtimeSnapshot.lastFrameAt) : '--'
      const rules = Array.isArray(runtimeSnapshot.rules) ? runtimeSnapshot.rules : []
      if (!rules.length) {
        ruleDebugList.innerHTML = '<div class="settings-note">No runtime rules available.</div>'
        return
      }
      ruleDebugList.innerHTML = rules.map(rule => {
        const status = ruleStatus(rule)
        const conditions = (Array.isArray(rule.conditions) ? rule.conditions : []).map(condition =>
          '<span class="condition-chip ' + (condition.matched ? 'matched' : '') + '">' + escapeHtml(conditionText(condition)) + '</span>'
        ).join('')
        return '<div class="rule-item">' +
          '<div class="rule-head"><div class="rule-id">' + escapeHtml(rule.id || 'rule') + '</div><div class="rule-status ' + status.className + '">' + status.text + '</div></div>' +
          '<div class="rule-meta">' +
            '<span>held ' + formatMs(rule.heldMs) + ' / ' + formatMs(rule.forMs) + '</span>' +
            '<span>cooldown ' + formatMs(rule.cooldownRemainingMs) + '</span>' +
            '<span>key ' + escapeHtml(rule.cooldownKey || rule.id || '-') + '</span>' +
            '<span>last ' + formatAgo(rule.lastTriggeredAt) + '</span>' +
            '<span>state ' + escapeHtml(rule.setState || '-') + '</span>' +
            '<span>emit ' + escapeHtml(rule.emit || '-') + '</span>' +
          '</div><div class="rule-conditions">' + conditions + '</div></div>'
      }).join('')
    }

    function sendRuntimeCommand(command, payload) {
      postToShell({ type: 'runtime.command', sceneId: SCENE_ID, command, payload: payload || {} })
    }

    function renderVisionSettings() {
      visionSettings = normalizeVisionSettings(visionSettings)
      backendGroup.querySelectorAll('button').forEach(button => {
        button.classList.toggle('active', button.dataset.backend === visionSettings.backend)
      })
      backendValue.textContent = visionSettings.backend
      inferRange.value = String(visionSettings.inferenceIntervalMs)
      inferValue.textContent = visionSettings.inferenceIntervalMs + 'ms'
      previewRange.value = String(visionSettings.previewIntervalMs)
      previewValue.textContent = visionSettings.previewIntervalMs + 'ms'
      confRange.value = String(visionSettings.confidenceThreshold)
      confValue.textContent = Number(visionSettings.confidenceThreshold).toFixed(2)
      settingsNote.classList.toggle('active', visionSettingsDirty)
      settingsNote.textContent = visionSettingsDirty
        ? 'Restart Analyze to apply these changes.'
        : 'Settings apply on next Analyze start.'
    }

    function updateVisionSettings(patch) {
      visionSettings = normalizeVisionSettings(Object.assign({}, visionSettings, patch))
      saveVisionSettings()
      if (visionRunning) visionSettingsDirty = true
      renderVisionSettings()
    }

    function renderSettingsPage() {
      settingsTabs.querySelectorAll('button[data-page]').forEach(button => {
        button.classList.toggle('active', button.dataset.page === settingsPage)
      })
      settingsPageRuntime.classList.toggle('active', settingsPage === 'runtime')
      settingsPageRules.classList.toggle('active', settingsPage === 'rules')
      if (settingsPage === 'rules') renderRuleDebug()
    }

    function openSettings() {
      renderVisionSettings()
      renderSettingsPage()
      settingsLayer.classList.add('active')
      settingsLayer.setAttribute('aria-hidden', 'false')
    }

    function closeSettings() {
      settingsLayer.classList.remove('active')
      settingsLayer.setAttribute('aria-hidden', 'true')
    }

    function toggleSettings() {
      if (settingsLayer.classList.contains('active')) closeSettings()
      else openSettings()
    }

    function visionStartPayload() {
      const settings = normalizeVisionSettings(visionSettings)
      return {
        type: 'vision.start',
        sceneId: SCENE_ID,
        modelId: 'yolov8n',
        backend: settings.backend,
        inferenceIntervalMs: settings.inferenceIntervalMs,
        previewIntervalMs: settings.previewIntervalMs,
        confidenceThreshold: settings.confidenceThreshold
      }
    }

    async function requestCameraPreview() {
      if (settingsLayer.classList.contains('active')) return
      if (cameraStream || visionRunning) return
      cameraBox.classList.add('starting')
      cameraBadge.textContent = 'Starting'
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        })
        cameraVideo.srcObject = cameraStream
        await cameraVideo.play()
        cameraBox.classList.add('live')
        cameraBadge.textContent = 'Live'
        addEvent('Camera preview started', { force: true })
      } catch (error) {
        cameraStream = null
        cameraBox.classList.remove('live')
        cameraBadge.textContent = 'Failed'
        addEvent('Camera failed', { force: true })
      }
    }

    function stopCameraPreview() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop())
        cameraStream = null
      }
      cameraVideo.srcObject = null
      cameraBox.classList.remove('live')
      if (!visionRunning) cameraBadge.textContent = 'Idle'
    }

    function startVision() {
      stopCameraPreview()
      visionRunning = true
      cameraBox.classList.remove('live', 'has-frame')
      cameraBadge.textContent = 'Analyzing'
      visionMetrics.textContent = 'Vision Starting'
      visionPreview.removeAttribute('src')
      visionSettingsDirty = false
      renderVisionSettings()
      window.setTimeout(() => postToShell(visionStartPayload()), 120)
      visionBtn.textContent = 'Stop'
      addEvent('Vision analysis requested', { force: true })
    }

    function stopVision() {
      if (!visionRunning) return
      visionRunning = false
      cameraBox.classList.remove('has-frame')
      visionPreview.removeAttribute('src')
      cameraBadge.textContent = 'Idle'
      visionMetrics.textContent = 'Vision Idle'
      visionBtn.textContent = 'Analyze'
      visionSettingsDirty = false
      renderVisionSettings()
      postToShell({ type: 'vision.stop', sceneId: SCENE_ID })
      addEvent('Vision analysis stopped', { force: true })
    }

    function applyVisionState(state) {
      if (!state) return
      if (state.state === 'running') {
        visionRunning = true
        cameraBox.classList.remove('live')
        const backend = state.model && state.model.actualBackend ? state.model.actualBackend : state.backend
        cameraBadge.textContent = 'AI · ' + backend
        visionBtn.textContent = 'Stop'
        return
      }
      if (state.state === 'starting') {
        visionRunning = true
        cameraBadge.textContent = 'Starting'
        visionBtn.textContent = 'Stop'
        return
      }
      if (state.state === 'error') {
        visionRunning = false
        cameraBox.classList.remove('has-frame')
        visionPreview.removeAttribute('src')
        cameraBadge.textContent = 'Vision Failed'
        visionMetrics.textContent = state.message || 'Vision Failed'
        visionBtn.textContent = 'Analyze'
        return
      }
      if (state.state === 'idle') {
        visionRunning = false
        cameraBox.classList.remove('has-frame')
        visionPreview.removeAttribute('src')
        cameraBadge.textContent = 'Idle'
        visionMetrics.textContent = 'Vision Idle'
        visionBtn.textContent = 'Analyze'
      }
    }

    function applyVisionFrame(frame) {
      if (!frame) return
      if (frame.preview) {
        latestPreview = frame.preview
        visionPreview.src = latestPreview
        cameraBox.classList.add('has-frame')
      }
      const fps = Number(frame.fps || 0).toFixed(1)
      const detections = Array.isArray(frame.detections) ? frame.detections : []
      const top = detections.slice(0, 2).map(item => item.label + ' ' + Math.round((item.score || 0) * 100) + '%').join(', ')
      visionMetrics.textContent = 'FPS ' + fps + ' · ' + frame.width + 'x' + frame.height + ' · ' + frame.backend + (top ? ' · ' + top : '') + ' · #' + frame.frameCount
      if (top) cameraBadge.textContent = top
    }

    document.getElementById('startBtn').addEventListener('click', () => sendRuntimeCommand('start'))
    document.getElementById('pauseBtn').addEventListener('click', () => sendRuntimeCommand('pause'))
    document.getElementById('resetBtn').addEventListener('click', () => {
      runtimeEventIds.clear()
      log = []
      sendRuntimeCommand('reset')
      renderEvents()
    })

    cameraBox.addEventListener('click', event => {
      if (event.target.closest('button, input, .settings-layer')) return
      requestCameraPreview()
    })
    previewBtn.addEventListener('click', event => {
      event.stopPropagation()
      if (visionRunning) stopVision()
      window.setTimeout(requestCameraPreview, 120)
    })
    visionBtn.addEventListener('click', event => {
      event.stopPropagation()
      if (visionRunning) stopVision()
      else startVision()
    })
    settingsBtn.addEventListener('click', openSettings)
    settingsClose.addEventListener('click', closeSettings)
    settingsLayer.addEventListener('click', event => {
      event.stopPropagation()
      if (event.target === settingsLayer) closeSettings()
    })
    settingsTabs.addEventListener('click', event => {
      const button = event.target.closest('button[data-page]')
      if (!button) return
      settingsPage = button.dataset.page
      renderSettingsPage()
    })
    backendGroup.addEventListener('click', event => {
      const button = event.target.closest('button[data-backend]')
      if (button) updateVisionSettings({ backend: button.dataset.backend })
    })
    inferRange.addEventListener('input', event => updateVisionSettings({ inferenceIntervalMs: event.target.value }))
    previewRange.addEventListener('input', event => updateVisionSettings({ previewIntervalMs: event.target.value }))
    confRange.addEventListener('input', event => updateVisionSettings({ confidenceThreshold: event.target.value }))

    window.addEventListener('message', event => {
      if (!event.data) return
      if (event.data.type === 'camera.stop') stopCameraPreview()
      if (event.data.type === 'scene.settings.open') openSettings()
      if (event.data.type === 'scene.settings.close') closeSettings()
      if (event.data.type === 'scene.settings.toggle') toggleSettings()
      if (event.data.type === 'vision.state') applyVisionState(event.data)
      if (event.data.type === 'vision.frame') applyVisionFrame(event.data)
      if (event.data.type && event.data.type.indexOf('runtime.') === 0) applyRuntimeMessage(event.data)
      if (event.data.type === 'scene.dispose') {
        stopCameraPreview()
        if (!event.data.keepVision) stopVision()
      }
    })
    window.addEventListener('pagehide', stopCameraPreview)

    renderVisionSettings()
    renderStatus()
    renderRuleDebug()
    setInterval(() => {
      sendRuntimeCommand('sync')
      renderStatus()
      renderRuleDebug()
    }, 1000)

    postToShell({ type: 'scene.ready', sceneId: SCENE_ID })
    postToShell({ type: 'runtime.subscribe', sceneId: SCENE_ID })
  </script>
</body>
</html>
