[package]
name = "lociant-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
slumberguard = [
    "dep:slumberguard-core",
    "dep:slumberguard-runtime",
    "dep:slumberguard-source",
]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
lociant-core = { path = "../core" }
lociant-rkllm = { path = "../rkllm" }
lociant-store = { path = "../store" }
lociant-tools = { path = "../tools" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
slumberguard-core = { path = "../../vendor/slumberguard/crates/core", optional = true }
slumberguard-runtime = { path = "../../vendor/slumberguard/crates/runtime", optional = true }
slumberguard-source = { path = "../../vendor/slumberguard/crates/source", optional = true }
socket2.workspace = true
sha2 = "0.10"
hex = "0.4"
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
