[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/tools",
    "crates/rkllm",
    "crates/server",
    "crates/tui",
]

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.8"
crossterm = "0.28"
ratatui = "0.29"
unicode-width = "0.2"
socket2 = "0.5"
